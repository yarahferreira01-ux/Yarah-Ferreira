<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ICS Soluções Comerciais</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1b33'/%3E%3Crect x='5' y='5' width='10' height='10' rx='2' fill='%23c9a54e'/%3E%3Crect x='5' y='17' width='10' height='10' rx='2' fill='%23c9a54e'/%3E%3Crect x='17' y='17' width='10' height='10' rx='2' fill='%23c9a54e'/%3E%3Cpath d='M19 5h8v8l-2.4-2.4L19 16.2 15.8 13l5.6-5.6z' fill='%23e9c97b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/player/player.css" />
  </head>
  <body>
    <div id="ambient"></div>
    <main id="screen">
      <div id="frame-wrap">
        <iframe id="comp" src="/composicao" title="ICS Soluções Comerciais" scrolling="no"></iframe>
      </div>
    </main>

    <p id="hint">Mova o mouse · toque nos blocos, na seta e no nome</p>

    <nav id="controls" aria-label="Controles">
      <button id="btn-play" aria-label="Pausar / continuar">
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
      </button>
      <div id="track" role="slider" aria-label="Linha do tempo" aria-valuemin="0" aria-valuemax="12" tabindex="0">
        <div id="fill"></div>
        <div id="chapters"></div>
        <div id="knob"></div>
      </div>
      <button id="btn-restart" aria-label="Recomeçar">
        <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /><path d="M4 4.5v5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </nav>

    <script src="/player/player.js" type="module"></script>
  </body>
</html>
