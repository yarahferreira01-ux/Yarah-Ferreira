<!doctype html>
<html lang="pt-BR" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond.woff2") format("woff2");
        font-weight: 300 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }

      :root {
        --navy: #0b1b33;
        --navy-deep: #060f1f;
        --gold: #c9a54e;
        --gold-light: #e9c97b;
        --cream: #f4efe4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse 70% 80% at 50% 48%, #10264a 0%, var(--navy) 55%, var(--navy-deep) 100%);
      }
      .plane {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* ---------- fundo: grade e poeira dourada ---------- */
      #grid {
        position: absolute;
        inset: -60px;
        background-image:
          linear-gradient(rgba(201, 165, 78, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(201, 165, 78, 0.07) 1px, transparent 1px);
        background-size: 120px 120px;
        mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 75%);
        opacity: 0;
      }
      .dust {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 236, 190, 1) 0%, rgba(233, 201, 123, 0.5) 35%, rgba(201, 165, 78, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* ---------- abertura: gráfico de crescimento ---------- */
      #chart {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      #chart-line {
        fill: none;
        stroke: var(--gold-light);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 10px rgba(233, 201, 123, 0.75));
      }
      #chart-area {
        fill: url(#area-grad);
        opacity: 0;
      }
      .node {
        fill: var(--navy);
        stroke: var(--gold-light);
        stroke-width: 4;
        opacity: 0;
      }
      .tick {
        position: absolute;
        font: 600 22px/1 "Montserrat", sans-serif;
        letter-spacing: 0.12em;
        color: var(--gold-light);
        opacity: 0;
        white-space: nowrap;
      }
      #comet {
        position: absolute;
        left: 0;
        top: 0;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, #ffe9b0 22%, rgba(233, 201, 123, 0.5) 45%, rgba(201, 165, 78, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* ---------- marca ---------- */
      #logo {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 960px 540px;
      }
      #icon {
        position: absolute;
        left: 331px;
        top: 389px;
        width: 304px;
        height: 304px;
      }
      .sq {
        position: absolute;
        width: 141px;
        height: 141px;
        border-radius: 18px;
        background: linear-gradient(145deg, #d6b45e 0%, var(--gold) 45%, #b8923f 100%);
        box-shadow: inset 0 1px 0 rgba(255, 240, 200, 0.35), 0 18px 40px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }
      .sq::after {
        /* reflexo que passa por cima do bloco */
        content: "";
        position: absolute;
        top: -50%;
        left: var(--shine, -120%);
        width: 60%;
        height: 200%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 250, 230, 0.55), rgba(255, 255, 255, 0));
        transform: rotate(20deg);
      }
      #sq-tl {
        left: 0;
        top: 0;
      }
      #sq-bl {
        left: 0;
        top: 163px;
      }
      #sq-br {
        left: 163px;
        top: 163px;
      }
      #arrow {
        position: absolute;
        left: 163px;
        top: 0;
        width: 141px;
        height: 141px;
        overflow: visible;
        filter: drop-shadow(0 0 0 rgba(255, 220, 140, 0));
      }
      #arrow polygon {
        fill: var(--gold-light);
      }
      #icon-glow {
        position: absolute;
        left: -160px;
        top: -160px;
        width: 624px;
        height: 624px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(233, 201, 123, 0.35) 0%, rgba(201, 165, 78, 0.12) 40%, rgba(201, 165, 78, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      #divider {
        position: absolute;
        left: 725px;
        top: 400px;
        width: 2px;
        height: 282px;
        background: linear-gradient(180deg, rgba(244, 239, 228, 0), rgba(244, 239, 228, 0.45) 20%, rgba(244, 239, 228, 0.45) 80%, rgba(244, 239, 228, 0));
        transform-origin: 50% 50%;
      }
      #divider-spark {
        position: absolute;
        left: 726px;
        top: 400px;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(233, 201, 123, 0.7) 35%, rgba(201, 165, 78, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      #name,
      #name-shine {
        position: absolute;
        left: 812px;
        top: 352px;
        height: 290px;
        font: 500 300px/290px "Cormorant Garamond", serif;
        letter-spacing: 0.06em;
        color: var(--cream);
        white-space: nowrap;
      }
      #name {
        clip-path: inset(-20px -40px 0 -40px);
      }
      #name .ltr,
      #name-shine .ltr {
        display: inline-block;
      }
      #name-shine {
        color: transparent;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0) 35%, #fff6d8 47%, var(--gold-light) 52%, rgba(255, 255, 255, 0) 64%);
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0;
      }

      #tagline {
        position: absolute;
        left: 816px;
        top: 648px;
        height: 30px;
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      #dash {
        width: 58px;
        height: 3px;
        background: var(--gold);
        margin-right: 26px;
        transform-origin: 0 50%;
      }
      #sub {
        font: 600 27px/30px "Montserrat", sans-serif;
        letter-spacing: 0.42em;
        color: var(--gold);
      }
      #sub .ch {
        display: inline-block;
        white-space: pre;
      }

      /* ---------- efeitos ---------- */
      #fx {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      .ring {
        fill: none;
        stroke: var(--gold-light);
        stroke-width: 3;
        opacity: 0;
      }
      .spark {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, #ffe3a0 40%, rgba(233, 201, 123, 0) 72%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #sweep {
        position: absolute;
        left: -700px;
        top: -300px;
        width: 420px;
        height: 1700px;
        background: linear-gradient(90deg, rgba(255, 236, 190, 0) 0%, rgba(255, 236, 190, 0.16) 50%, rgba(255, 236, 190, 0) 100%);
        transform: rotate(18deg);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 1064px 438px, rgba(255, 240, 200, 0.55) 0%, rgba(255, 220, 150, 0.15) 30%, rgba(255, 220, 150, 0) 60%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 85% 85% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(2, 6, 14, 0.55) 100%);
        pointer-events: none;
      }
      #veil {
        position: absolute;
        inset: 0;
        background: var(--navy-deep);
        opacity: 0;
        pointer-events: none;
      }

      /* áreas clicáveis (só ganham ponteiro no player interativo) */
      .hotspot {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <!-- plano de fundo -->
      <div class="plane" id="par-bg">
        <div id="grid" data-layout-allow-overflow></div>
        <div id="dust-layer"></div>
      </div>

      <!-- os planos "tilt-*" e "par-*" sem animação na timeline existem para o player
           interativo inclinar a cena em profundidade sem brigar com o vídeo -->
      <!-- abertura: gráfico que sobe e vira a seta da marca -->
      <div class="plane" id="tilt-chart">
        <div class="plane" id="par-chart">
          <svg id="chart" viewBox="0 0 1920 1080" data-layout-allow-overflow>
            <defs>
              <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e9c97b" stop-opacity="0.28" />
                <stop offset="1" stop-color="#e9c97b" stop-opacity="0" />
              </linearGradient>
              <clipPath id="area-clip"><rect id="area-clip-rect" x="0" y="0" width="0" height="1080" /></clipPath>
            </defs>
            <path id="chart-area" clip-path="url(#area-clip)" d="M120 900 L420 760 L660 820 L940 600 L1180 660 L1460 400 L1760 210 L1760 1080 L120 1080 Z" />
            <path id="chart-line" d="M120 900 L420 760 L660 820 L940 600 L1180 660 L1460 400 L1760 210" />
            <circle class="node" cx="420" cy="760" r="11" />
            <circle class="node" cx="660" cy="820" r="11" />
            <circle class="node" cx="940" cy="600" r="11" />
            <circle class="node" cx="1180" cy="660" r="11" />
            <circle class="node" cx="1460" cy="400" r="11" />
          </svg>
          <div class="tick" style="left: 392px; top: 712px">+12%</div>
          <div class="tick" style="left: 908px; top: 552px">+38%</div>
          <div class="tick" style="left: 1428px; top: 352px">+74%</div>
          <div id="comet" data-layout-allow-overflow></div>
        </div>
      </div>

      <!-- a marca -->
      <div class="plane" id="logo">
        <div class="plane" id="tilt-icon">
          <div class="plane" id="par-icon">
            <div id="icon">
              <div id="icon-glow" data-layout-allow-overflow></div>
              <div class="sq" id="sq-tl"></div>
              <div class="sq" id="sq-bl"></div>
              <div class="sq" id="sq-br"></div>
              <svg id="arrow" viewBox="0 0 88 88" data-layout-allow-overflow>
                <polygon points="20,0 88,0 88,68 67,47 26,88 0,88 0,62 41,21" />
              </svg>
              <div class="hotspot" data-hotspot="icon" style="left: 0; top: 0; width: 304px; height: 304px"></div>
              <div class="hotspot" data-hotspot="arrow" style="left: 163px; top: 0; width: 141px; height: 141px"></div>
            </div>
          </div>
        </div>

        <div class="plane" id="par-text">
          <div id="divider"></div>
          <div id="divider-spark" data-layout-allow-overflow></div>
          <div id="name" aria-label="ICS"><span class="ltr">I</span><span class="ltr">C</span><span class="ltr">S</span></div>
          <div id="name-shine" aria-hidden="true">ICS</div>
          <div id="tagline">
            <div id="dash"></div>
            <div id="sub" aria-label="Soluções Comerciais"></div>
          </div>
          <div class="hotspot" data-hotspot="name" style="left: 800px; top: 360px; width: 520px; height: 260px"></div>
          <div class="hotspot" data-hotspot="tagline" style="left: 800px; top: 630px; width: 820px; height: 70px"></div>
        </div>
      </div>

      <!-- efeitos por cima -->
      <div class="plane" id="par-fx">
        <svg id="fx" viewBox="0 0 1920 1080" data-layout-allow-overflow>
          <circle class="ring" cx="1064" cy="438" r="20" />
          <circle class="ring" cx="1064" cy="438" r="20" />
          <circle class="ring" cx="1064" cy="438" r="20" />
          <circle class="ring brand-ring" cx="483" cy="541" r="40" />
          <circle class="ring brand-ring" cx="483" cy="541" r="40" />
        </svg>
        <div id="sparks"></div>
        <div id="sweep" data-layout-allow-overflow></div>
        <div id="flash"></div>
      </div>

      <div id="vignette"></div>
      <div id="veil"></div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const DUR = 12;
        // centro da seta na abertura: o ícone começa centralizado (x+480) e ampliado (1.25x
        // em torno de 483,541), então a seta (564,459 no layout final) fica em 1064,438
        const ARROW = { x: 1064, y: 438 };

        // PRNG com semente: o vídeo sai igual em todo render
        let seed = 1977;
        const rand = () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rr = (a, b) => a + (b - a) * rand();

        // ---------- elementos gerados ----------
        const sub = document.getElementById("sub");
        "SOLUÇÕES COMERCIAIS".split("").forEach((c) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          sub.appendChild(s);
        });

        const dustLayer = document.getElementById("dust-layer");
        const dust = [];
        for (let i = 0; i < 46; i++) {
          const d = document.createElement("div");
          d.className = "dust";
          const s = rr(4, 16);
          Object.assign(d.style, {
            left: rr(0, 1920) + "px",
            top: rr(80, 1120) + "px",
            width: s + "px",
            height: s + "px",
          });
          d.setAttribute("data-layout-allow-overflow", "");
          dustLayer.appendChild(d);
          dust.push(d);
        }

        const sparksEl = document.getElementById("sparks");
        const sparks = [];
        for (let i = 0; i < 26; i++) {
          const p = document.createElement("div");
          p.className = "spark";
          p.style.left = ARROW.x + "px";
          p.style.top = ARROW.y + "px";
          const a = (i / 26) * Math.PI * 2 + rr(-0.15, 0.15);
          const dist = rr(120, 320);
          p.dataset.dx = (Math.cos(a) * dist).toFixed(1);
          p.dataset.dy = (Math.sin(a) * dist).toFixed(1);
          p.setAttribute("data-layout-allow-overflow", "");
          sparksEl.appendChild(p);
          sparks.push(p);
        }

        const tl = gsap.timeline({ paused: true });

        // ---------- poeira dourada sempre subindo (o vídeo todo) ----------
        dust.forEach((el, i) => {
          const t0 = rr(0, 1.5);
          tl.to(el, { opacity: rr(0.35, 0.9), duration: 1.2, ease: "sine.out" }, t0);
          tl.to(el, { y: rr(-420, -180), x: rr(-60, 60), duration: DUR - t0, ease: "none" }, t0);
          tl.to(el, { opacity: rr(0.1, 0.3), duration: rr(0.8, 1.6), yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + rr(1.5, 3));
        });
        tl.to("#grid", { opacity: 1, duration: 1.6, ease: "power1.out" }, 0);
        tl.fromTo("#grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px -240px", duration: DUR, ease: "none" }, 0);

        // ---------- 1) gráfico de crescimento (0 – 2.4s) ----------
        const line = document.getElementById("chart-line");
        const len = line.getTotalLength();
        gsap.set(line, { strokeDasharray: len, strokeDashoffset: len });
        const CH0 = 0.25, CHD = 1.75;
        tl.to(line, { strokeDashoffset: 0, duration: CHD, ease: "power2.inOut" }, CH0);
        tl.set("#chart-area", { opacity: 1 }, CH0);
        const areaClip = document.getElementById("area-clip-rect");
        const prog = { v: 0 };
        tl.set("#comet", { opacity: 1 }, CH0);
        tl.to(prog, {
          v: 1,
          duration: CHD,
          ease: "power2.inOut",
          onUpdate: () => {
            const p = line.getPointAtLength(prog.v * len);
            gsap.set("#comet", { x: p.x, y: p.y });
            // o preenchimento acompanha a ponta da linha
            areaClip.setAttribute("width", p.x);
          },
        }, CH0);
        // nós e rótulos aparecem quando a linha passa por eles
        const NODE_F = [0.17, 0.27, 0.45, 0.55, 0.77];
        gsap.utils.toArray(".node").forEach((el, i) => {
          const t = CH0 + NODE_F[i] * CHD;
          tl.fromTo(el, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, t);
        });
        gsap.utils.toArray(".tick").forEach((el, i) => {
          const t = CH0 + [0.17, 0.45, 0.77][i] * CHD + 0.05;
          tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        });
        // a câmera acompanha a subida
        tl.fromTo("#par-chart", { x: 120, y: 60, scale: 1.08 }, { x: -40, y: -10, scale: 1, duration: 2.2, ease: "power2.inOut" }, 0);

        // o cometa voa do topo do gráfico até o lugar da seta
        const FLY = 2.05;
        tl.to("#comet", { x: ARROW.x + 40, y: ARROW.y, scale: 1.8, duration: 0.5, ease: "power3.in" }, FLY);
        tl.to("#comet", { opacity: 0, scale: 3, duration: 0.25, ease: "power2.out" }, FLY + 0.5);
        tl.to(["#chart-line", "#chart-area", ".node", ".tick"], { opacity: 0, duration: 0.5, ease: "power2.in", stagger: 0.02 }, FLY);
        tl.to("#chart", { y: 60, duration: 0.6, ease: "power2.in" }, FLY);

        // ---------- 2) a seta nasce e os blocos se encaixam (2.5 – 4.2s) ----------
        const ICON_T = 2.5;
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, ICON_T);
        tl.to("#flash", { opacity: 0, duration: 0.9, ease: "power2.out" }, ICON_T + 0.12);
        tl.fromTo("#arrow",
          { opacity: 0, scale: 0.2, x: -70, y: 70, transformOrigin: "0% 100%" },
          { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.7, ease: "back.out(2.2)" }, ICON_T);
        gsap.utils.toArray(".ring:not(.brand-ring)").forEach((el, i) => {
          tl.set(el, { attr: { r: 20 }, opacity: 0.9 }, ICON_T + i * 0.14);
          tl.to(el, { attr: { r: 260 + i * 80 }, opacity: 0, duration: 1.3 + i * 0.2, ease: "power2.out" }, ICON_T + i * 0.14);
        });
        sparks.forEach((el, i) => {
          tl.set(el, { x: 0, y: 0, opacity: 1, scale: 1.3 }, ICON_T + 0.02);
          tl.to(el, { x: +el.dataset.dx, y: +el.dataset.dy + 30, opacity: 0, scale: 0.3, duration: 1 + (i % 4) * 0.15, ease: "power3.out" }, ICON_T + 0.02);
        });

        // blocos chegam de direções diferentes, como peças de um sistema
        const BLOCKS = [
          ["#sq-bl", { x: -260, y: 180, rotation: -35 }, 0.25],
          ["#sq-br", { x: 60, y: 300, rotation: 25 }, 0.4],
          ["#sq-tl", { x: -300, y: -120, rotation: -20 }, 0.55],
        ];
        BLOCKS.forEach(([sel, from, d]) => {
          tl.fromTo(sel,
            { opacity: 0, scale: 0.3, ...from },
            { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: 0.8, ease: "expo.out" }, ICON_T + d);
        });
        // pequeno "encaixe": o ícone inteiro dá um tranco quando o último bloco chega
        tl.fromTo("#icon", { scale: 1 }, { scale: 0.94, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, ICON_T + 0.95);
        tl.to("#icon-glow", { opacity: 1, duration: 0.6, ease: "power2.out" }, ICON_T + 0.9);
        tl.to("#icon-glow", { opacity: 0.45, duration: 1.2, ease: "sine.inOut" }, ICON_T + 1.5);
        // a seta "empurra" para cima, reforçando o crescimento
        tl.to("#arrow", { x: 14, y: -14, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, ICON_T + 1.35);

        // ícone começa centralizado e desliza para o lugar quando o texto entra
        tl.fromTo("#par-icon", { x: 480, scale: 1.25, transformOrigin: "483px 541px" }, { x: 480, scale: 1.25, duration: 0.01 }, 0);
        tl.to("#par-icon", { x: 0, scale: 1, duration: 1.1, ease: "expo.inOut" }, 4.0);

        // ---------- 3) divisor (4.6 – 5.4s) ----------
        tl.fromTo("#divider", { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.8, ease: "power3.inOut" }, 4.6);
        tl.set("#divider-spark", { opacity: 1, y: 141 }, 4.6);
        tl.to("#divider-spark", { y: 0, duration: 0.4, ease: "power2.out" }, 4.6);
        tl.to("#divider-spark", { y: 282, duration: 0.8, ease: "power2.inOut" }, 5.0);
        tl.to("#divider-spark", { opacity: 0, duration: 0.25 }, 5.65);

        // ---------- 4) ICS (4.9 – 6.6s) ----------
        // cada letra sobe da máscara e as três se aproximam (espaçamento animado via x)
        gsap.utils.toArray("#name .ltr").forEach((el, i) => {
          const t = 4.9 + i * 0.16;
          tl.fromTo(el,
            { yPercent: 105, opacity: 0, filter: "blur(14px)" },
            { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, t);
          tl.fromTo(el, { x: (i - 1) * 46 }, { x: 0, duration: 1.4, ease: "expo.out" }, 4.9);
        });
        // brilho dourado atravessando as letras
        tl.set("#name-shine", { opacity: 1, backgroundPosition: "100% 0" }, 6.2);
        tl.to("#name-shine", { backgroundPosition: "0% 0", duration: 1.1, ease: "power2.inOut" }, 6.2);
        tl.set("#name-shine", { opacity: 0 }, 7.35);

        // ---------- 5) Soluções Comerciais (6.4 – 7.8s) ----------
        tl.fromTo("#dash", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 6.4);
        const subChars = gsap.utils.toArray("#sub .ch");
        subChars.forEach((el, i) => {
          // entra letra a letra enquanto o espaçamento se fecha (via x)
          tl.fromTo(el,
            { opacity: 0, x: i * 8, y: 16, filter: "blur(6px)" },
            { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 6.6 + i * 0.035);
        });

        // ---------- 6) momento da marca (8 – 10.4s) ----------
        tl.fromTo("#logo", { scale: 1 }, { scale: 1.035, duration: 4, ease: "sine.inOut" }, 7.8);
        tl.set("#sweep", { opacity: 1, x: 0 }, 8.0);
        tl.to("#sweep", { x: 2700, duration: 1.6, ease: "power2.inOut" }, 8.0);
        // reflexo correndo pelos blocos, em sequência
        [["#sq-bl", 8.2], ["#sq-tl", 8.35], ["#sq-br", 8.5]].forEach(([sel, t]) => {
          tl.fromTo(sel, { "--shine": "-120%" }, { "--shine": "160%", duration: 0.7, ease: "power2.inOut" }, t);
        });
        tl.to("#arrow", { filter: "drop-shadow(0 0 18px rgba(255,220,140,0.9))", duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 8.6);
        gsap.utils.toArray(".brand-ring").forEach((el, i) => {
          tl.set(el, { attr: { r: 160 }, opacity: 0.55 }, 8.7 + i * 0.3);
          tl.to(el, { attr: { r: 520 + i * 120 }, opacity: 0, duration: 2, ease: "power2.out" }, 8.7 + i * 0.3);
        });
        tl.to("#icon-glow", { opacity: 0.85, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 8.6);

        // ---------- 7) respiração final e fechamento em loop (10.4 – 12s) ----------
        tl.to("#arrow", { x: 6, y: -6, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 10.2);
        tl.to("#veil", { opacity: 1, duration: 0.7, ease: "power2.in" }, 11.3);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
